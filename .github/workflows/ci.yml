name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: Check go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Run go vet
        run: go vet ./...
      - name: Check modernizers
        run: go fix -diff ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          args: --timeout=5m

  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.27"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out

  build:
    name: Build (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.27"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build
        run: go build ./...

  test-rollup:
    name: Test
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test matrix failed"
            exit 1
          fi

  build-rollup:
    name: Build
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build matrix failed"
            exit 1
          fi

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  speccheck:
    name: Spec Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/speccheck
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: tools/speccheck/go.sum
      - name: Check go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Run go vet
        run: go vet ./...
      - name: Check modernizers
        run: go fix -diff ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          working-directory: tools/speccheck
          args: --timeout=5m
      - name: Run tests
        run: go test -race -count=1 ./...
      - name: Check the client against the vendored OpenAPI document
        run: go run . check --fail-on-missing
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  api-compat:
    name: API Compatibility
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      # Compares the exported API with the latest released tag. While that tag is
      # v0.x any change is allowed; from v1.0.0 on an incompatible change fails
      # the job, and the fix is to keep the API or to release a new major version.
      - name: Check API compatibility
        run: go run golang.org/x/exp/cmd/gorelease@v0.0.0-20261113113407-e3970619a1a4
