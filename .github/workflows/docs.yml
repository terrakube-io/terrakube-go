name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Sourcey
        working-directory: docs
        run: npm install --no-save sourcey

      # Regenerated from this checkout, so the reference always matches the
      # source it documents (nothing generated is committed to the repo).
      - name: Generate godoc snapshot
        working-directory: docs
        run: ./node_modules/.bin/sourcey godoc -m .. -o godoc.json

      - name: Build site
        working-directory: docs
        run: ./node_modules/.bin/sourcey build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
